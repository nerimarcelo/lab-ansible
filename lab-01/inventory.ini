[lab]
node1 ansible_host=localhost ansible_port=2221 ansible_user=ansible
node2 ansible_host=localhost ansible_port=2222 ansible_user=ansible
node3 ansible_host=localhost ansible_port=2223 ansible_user=ansible

[lab:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=lab/keys/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
